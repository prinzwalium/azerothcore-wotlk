# AzerothCore + mod-playerbots, running from prebuilt images.
#
# Nothing in here is built locally: every image is pulled from the container
# registry that the `Build and publish Playerbots images` workflow pushes to.
#
#   docker compose pull
#   docker compose up -d
#
# All configuration lives in the `.env` file next to this one. Copy
# `.env.example` to `.env` first and edit that; this file should not need to be
# touched.

services:
  ac-database:
    container_name: ac-database
    image: mysql:8.4
    command: >
      --innodb-buffer-pool-size=${DB_BUFFER_POOL_SIZE:-1G}
      --max-connections=${DB_MAX_CONNECTIONS:-256}
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    networks:
      - ac-network
    ports:
      - ${DB_EXTERNAL_PORT:-127.0.0.1:3306}:3306
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
    volumes:
      - ac-database:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: "/usr/bin/mysql --user=root --password=$$MYSQL_ROOT_PASSWORD --execute \"SHOW DATABASES;\""
      interval: 5s
      timeout: 10s
      retries: 60

  # Downloads the extracted client data (maps/vmaps/mmaps/dbc, several GB) into
  # the ac-client-data volume. Runs once, then exits.
  ac-client-data-init:
    container_name: ac-client-data-init
    image: ${AC_IMAGE_REGISTRY:-ghcr.io/prinzwalium/azerothcore-wotlk}/client-data:${AC_IMAGE_TAG:-latest}
    networks:
      - ac-network
    volumes:
      - ac-client-data:/azerothcore/env/dist/data
    restart: "no"

  # Creates and populates acore_auth / acore_world / acore_characters, applies
  # the world and character SQL shipped by mod-playerbots, and then runs the
  # optional first-run bootstrap (realmlist address + admin account).
  # Runs on every start, but only does work when something changed.
  ac-db-import:
    container_name: ac-db-import
    image: ${AC_IMAGE_REGISTRY:-ghcr.io/prinzwalium/azerothcore-wotlk}/db-import:${AC_IMAGE_TAG:-latest}
    networks:
      - ac-network
    environment:
      AC_DATA_DIR: "/azerothcore/env/dist/data"
      AC_LOGS_DIR: "/azerothcore/env/dist/logs"
      AC_LOGIN_DATABASE_INFO: "ac-database;3306;root;${DB_ROOT_PASSWORD};acore_auth"
      AC_WORLD_DATABASE_INFO: "ac-database;3306;root;${DB_ROOT_PASSWORD};acore_world"
      AC_CHARACTER_DATABASE_INFO: "ac-database;3306;root;${DB_ROOT_PASSWORD};acore_characters"
      # First-run bootstrap. Both steps are skipped when left empty.
      REALM_ADDRESS: ${REALM_ADDRESS:-}
      REALM_NAME: ${REALM_NAME:-AzerothCore}
      REALM_PORT: ${WORLD_EXTERNAL_PORT:-8085}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_GMLEVEL: ${ADMIN_GMLEVEL:-3}
    volumes:
      - ac-etc:/azerothcore/env/dist/etc
      - ac-logs:/azerothcore/env/dist/logs
    restart: "no"
    depends_on:
      ac-database:
        condition: service_healthy

  ac-authserver:
    container_name: ac-authserver
    image: ${AC_IMAGE_REGISTRY:-ghcr.io/prinzwalium/azerothcore-wotlk}/authserver:${AC_IMAGE_TAG:-latest}
    networks:
      - ac-network
    tty: true
    restart: unless-stopped
    environment:
      AC_LOGS_DIR: "/azerothcore/env/dist/logs"
      AC_TEMP_DIR: "/azerothcore/env/dist/temp"
      AC_LOGIN_DATABASE_INFO: "ac-database;3306;root;${DB_ROOT_PASSWORD};acore_auth"
    ports:
      - ${AUTH_EXTERNAL_PORT:-3724}:3724
    volumes:
      - ac-etc:/azerothcore/env/dist/etc
      - ac-logs:/azerothcore/env/dist/logs
    depends_on:
      ac-database:
        condition: service_healthy
      ac-db-import:
        condition: service_completed_successfully

  ac-worldserver:
    container_name: ac-worldserver
    image: ${AC_IMAGE_REGISTRY:-ghcr.io/prinzwalium/azerothcore-wotlk}/worldserver:${AC_IMAGE_TAG:-latest}
    networks:
      - ac-network
    stdin_open: true
    tty: true
    restart: unless-stopped
    environment:
      AC_DATA_DIR: "/azerothcore/env/dist/data"
      AC_LOGS_DIR: "/azerothcore/env/dist/logs"
      AC_LOGIN_DATABASE_INFO: "ac-database;3306;root;${DB_ROOT_PASSWORD};acore_auth"
      AC_WORLD_DATABASE_INFO: "ac-database;3306;root;${DB_ROOT_PASSWORD};acore_world"
      AC_CHARACTER_DATABASE_INFO: "ac-database;3306;root;${DB_ROOT_PASSWORD};acore_characters"
      # The playerbots database is created and migrated by the module itself on
      # the first start, so this connection string is required for bots to work.
      AC_PLAYERBOTS_DATABASE_INFO: "ac-database;3306;root;${DB_ROOT_PASSWORD};acore_playerbots"
      # Playerbots knobs. Every setting in playerbots.conf can be overridden the
      # same way: AiPlayerbot.SomeOption becomes AC_AI_PLAYERBOT_SOME_OPTION.
      AC_AI_PLAYERBOT_ENABLED: ${PLAYERBOTS_ENABLED:-1}
      AC_AI_PLAYERBOT_RANDOM_BOT_AUTOLOGIN: ${PLAYERBOTS_RANDOM_BOT_AUTOLOGIN:-1}
      AC_AI_PLAYERBOT_MIN_RANDOM_BOTS: ${PLAYERBOTS_MIN_RANDOM_BOTS:-100}
      AC_AI_PLAYERBOT_MAX_RANDOM_BOTS: ${PLAYERBOTS_MAX_RANDOM_BOTS:-100}
    ports:
      - ${WORLD_EXTERNAL_PORT:-8085}:8085
      - ${SOAP_EXTERNAL_PORT:-127.0.0.1:7878}:7878
    volumes:
      - ac-etc:/azerothcore/env/dist/etc
      - ac-logs:/azerothcore/env/dist/logs
      - ac-client-data:/azerothcore/env/dist/data:ro
    depends_on:
      ac-database:
        condition: service_healthy
      ac-db-import:
        condition: service_completed_successfully
      ac-client-data-init:
        condition: service_completed_successfully

volumes:
  ac-database:
  ac-client-data:
  ac-etc:
  ac-logs:

networks:
  ac-network:
