name: Build and publish Playerbots images

# Builds the AzerothCore service images with mod-playerbots baked in and pushes
# them to GHCR, so that deploying is `docker compose pull && docker compose up`
# instead of an hour of compiling on the target machine.
#
# Published images (one per compose service):
#   ghcr.io/<owner>/azerothcore-wotlk/worldserver
#   ghcr.io/<owner>/azerothcore-wotlk/authserver
#   ghcr.io/<owner>/azerothcore-wotlk/db-import
#   ghcr.io/<owner>/azerothcore-wotlk/client-data
#
# Each is tagged with the commit sha and, on the Playerbot branch, `latest`.

on:
  push:
    branches:
      - Playerbot
      - claude/azerothcore-docker-playerbots-kpd1o0
  workflow_dispatch:
    inputs:
      playerbots_ref:
        description: "mod-playerbots branch, tag or commit to build against"
        required: false
        default: "master"
      ahbot_ref:
        description: "mod-ah-bot-plus branch, tag or commit to build against"
        required: false
        default: "master"
      tag:
        description: "Primary image tag to publish"
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  PLAYERBOTS_REPO: https://github.com/mod-playerbots/mod-playerbots.git
  AHBOT_REPO: https://github.com/NathanHandley/mod-ah-bot-plus.git

jobs:
  build:
    # GitHub-hosted. Slower than a self-hosted machine (about 55 minutes for a
    # full core + modules compile, against roughly 20 on a decent desktop) but
    # it needs nothing maintained: a self-hosted runner has to have Docker
    # installed, its daemon running at boot, and the runner's user in the docker
    # group, and each of those failing looks like a red build rather than a
    # broken machine.
    #
    # To go back to self-hosted, swap the line below for `self-hosted` (or
    # `${{ vars.DOCKER_BUILD_RUNNER || 'ubuntu-latest' }}` to drive it from a
    # repository variable). The disk-cleanup step below keys off
    # runner.environment, so it follows automatically either way.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # The compile needs every gigabyte it can get on a hosted runner, where
      # these paths are preinstalled toolchains nobody here uses and the runner
      # is thrown away afterwards. On a self-hosted runner they are somebody's
      # actual machine, so this must never run there.
      - name: Free up disk space
        if: runner.environment == 'github-hosted'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc "${AGENT_TOOLSDIRECTORY:-}" || true
          df -h /

      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve mod-playerbots revision
        id: module
        run: |
          ref="${{ github.event.inputs.playerbots_ref || 'master' }}"
          # Pinning the module to an exact commit keeps the build cache stable:
          # with a branch name every build would have to assume it moved.
          sha="$(git ls-remote "$PLAYERBOTS_REPO" "$ref" | head -n1 | cut -f1)"
          if [[ -z "$sha" ]]; then
            # Not a branch or tag, so assume it already is a commit sha.
            sha="$ref"
          fi
          echo "Building against mod-playerbots $ref ($sha)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Resolve mod-ah-bot-plus revision
        id: ahbot
        run: |
          ref="${{ github.event.inputs.ahbot_ref || 'master' }}"
          sha="$(git ls-remote "$AHBOT_REPO" "$ref" | head -n1 | cut -f1)"
          if [[ -z "$sha" ]]; then
            sha="$ref"
          fi
          echo "Building against mod-ah-bot-plus $ref ($sha)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Work out image tags
        id: tags
        run: |
          tag="${{ github.event.inputs.tag }}"
          if [[ -z "$tag" ]]; then
            if [[ "${{ github.ref_name }}" == "Playerbot" ]]; then
              tag="latest"
            else
              # Branch names may contain slashes, which tags may not.
              tag="${{ github.ref_name }}"
              tag="${tag//\//-}"
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # One bake invocation for all four images: the shared build stage (the
      # part that actually takes hours) is then resolved exactly once.
      - name: Build and push
        uses: docker/bake-action@v5
        with:
          files: docker-bake.hcl
          push: true
        env:
          REGISTRY: ${{ env.REGISTRY }}/${{ github.repository }}
          TAG: ${{ steps.tags.outputs.tag }}
          EXTRA_TAG: ${{ github.sha }}
          PLAYERBOTS_REPO: ${{ env.PLAYERBOTS_REPO }}
          PLAYERBOTS_REF: ${{ steps.module.outputs.sha }}
          AHBOT_REPO: ${{ env.AHBOT_REPO }}
          AHBOT_REF: ${{ steps.ahbot.outputs.sha }}
          CACHE_FROM: type=gha,scope=acore-playerbots
          CACHE_TO: type=gha,mode=max,scope=acore-playerbots

      - name: Summary
        run: |
          {
            echo "### Published images"
            echo
            echo "mod-playerbots: \`${{ steps.module.outputs.sha }}\`"
            echo "mod-ah-bot-plus: \`${{ steps.ahbot.outputs.sha }}\`"
            echo
            for component in worldserver authserver db-import client-data; do
              echo "- \`${{ env.REGISTRY }}/${{ github.repository }}/$component:${{ steps.tags.outputs.tag }}\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"
