name: macos-build

on:
  push:
    branches:
      - "Playerbot"
      - "test-staging"
  pull_request:
    branches:
      - "Playerbot"
      - "test-staging"

concurrency:
  # One concurrency group per workflow + ref (matches the other build workflows).
  # PRs cancel superseded runs; branch pushes are isolated by ref.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: write
  contents: read

jobs:
  macos-build:
    strategy:
      fail-fast: false
      matrix:
        os:
          # macos-14 is past the point where Homebrew builds bottles for it, so
          # `install-deps` fell back to compiling MySQL from source and died:
          #
          #   You are using macOS 14. ... Homebrew no longer builds bottles for
          #   this configuration.
          #   make: *** [all] Error 2
          #
          # The job never reached AzerothCore itself. Bottles exist again on 15.
          - macos-15
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }}
    steps:
      - name: Checkout AzerothCore
        uses: actions/checkout@v7

      # Same pin as the other builds and the published images -- see the
      # PLAYERBOTS_REF variable in docker-bake.hcl. Upstream's tip needs a newer
      # core than this fork has, so tracking it fails before compiling anything
      # of ours.
      - name: Resolve the pinned mod-playerbots revision
        id: pin
        run: echo "ref=$(apps/docker/scripts/bake-default.sh PLAYERBOTS_REF)" >> "$GITHUB_OUTPUT"

      - name: Checkout Playerbot Module
        uses: actions/checkout@v7
        with:
          repository: mod-playerbots/mod-playerbots
          ref: ${{ steps.pin.outputs.ref }}
          path: modules/mod-playerbots

      - name: Cache
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/ccache
          # Unique per run so the cache is re-saved every run instead of
          # freezing on the first (a static key hits itself and skips upload).
          key: ccache:${{ matrix.os }}:${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ccache:${{ matrix.os }}:${{ github.ref_name }}-
            ccache:${{ matrix.os }}

      - name: reset ccache stats
        shell: bash
        run: ccache -z || true

      - name: Install latest bash
        run: brew install bash

      - name: Configure OS
        shell: bash
        run: source ./acore.sh install-deps

      - name: Build
        shell: bash
        run: source ./apps/ci/mac/ci-compile.sh

      - name: ccache stats
        shell: bash
        run: ccache -s || true