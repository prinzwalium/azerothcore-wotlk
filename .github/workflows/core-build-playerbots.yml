# This starter workflow is for a CMake project running on multiple platforms. There is a different starter workflow if you just want a single platform.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-single-platform.yml
name: ubuntu-build

on:
  push:
    branches: [ "Playerbot", "test-staging" ]
  pull_request:
    branches: [ "Playerbot", "test-staging" ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            c_compiler: clang
            cpp_compiler: clang++
            build_type: Release
          - os: ubuntu-22.04
            c_compiler: gcc
            cpp_compiler: g++
            build_type: Release
          - os: ubuntu-24.04
            c_compiler: gcc
            cpp_compiler: g++
            build_type: Release
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }}-${{ matrix.cpp_compiler }}

    steps:
      - name: Checkout AzerothCore
        uses: actions/checkout@v3

      - name: Set reusable strings
        id: strings
        shell: bash
        run: |
          echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

      # The module revision is pinned in docker-bake.hcl and read from there, so
      # that this job and the published images are built against the same code.
      # It used to check out upstream's tip, which meant a red build here the
      # moment upstream depended on something this core does not have -- as
      # happened when mod-playerbots' new src/Db/PlayerbotsDatabase.h started
      # including the core header ModuleDatabasePool.h:
      #
      #   fatal error: 'ModuleDatabasePool.h' file not found
      #
      # To check whether upstream's tip builds again, run this workflow with the
      # ref below temporarily set to 'master'.
      - name: Resolve the pinned mod-playerbots revision
        id: pin
        run: echo "ref=$(apps/docker/scripts/bake-default.sh PLAYERBOTS_REF)" >> "$GITHUB_OUTPUT"

      - name: Checkout Playerbot Module
        uses: actions/checkout@v3
        with:
          repository: mod-playerbots/mod-playerbots
          ref: ${{ steps.pin.outputs.ref }}
          path: modules/mod-playerbots

      - name: Install Requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y git cmake make gcc g++ clang \
            libmysqlclient-dev libssl-dev libbz2-dev \
            libreadline-dev libncurses-dev mysql-server libboost-all-dev

      - name: Configure CMake
        run: |
          cmake -B ${{ steps.strings.outputs.build-output-dir }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }} \
            -DCMAKE_C_COMPILER=${{ matrix.c_compiler }} \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -S ${{ github.workspace }}

      - name: Build
        run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}